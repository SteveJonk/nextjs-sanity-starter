name: Build App Image

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/build-app-image.yml"
  workflow_dispatch:

# Eén build tegelijk; een nieuwe push annuleert een lopende run.
concurrency:
  group: build-app-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker-image-namen moeten lowercase zijn; owner en repo-naam zijn dat
      # niet altijd (bv. "SteveJonk").
      - name: Lowercase image naam
        id: image
        run: echo "name=ghcr.io/${OWNER,,}/${REPO,,}-app" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}

      # NEXT_PUBLIC_* worden in de client-bundle gebakken, dus die moeten bij
      # het bouwen bekend zijn — geen geheimen, dus gewoon als build-arg.
      - name: Build en push image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SANITY_PROJECT_ID=${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
            NEXT_PUBLIC_SANITY_DATASET=${{ vars.NEXT_PUBLIC_SANITY_DATASET }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
